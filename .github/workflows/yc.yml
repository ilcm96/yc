# yc's own CI and release. Upstream workflows need Blacksmith runners and T3 secrets, so they stay
# disabled in this repository; see PERSONAL.md.
name: YC

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yc-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check i18n catalogs
        run: vp run i18n:check

      - name: Format and lint
        run: vp check

      - name: Check unused code
        run: vp run knip:check

      - name: Typecheck
        run: vp run typecheck

      - name: Check yc invariants
        run: scripts/yc/check-invariants.sh

  # Every package except the ones with their own sharded jobs below.
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      # The desktop tests compile the browser secret helper; apt runs while Vite+ installs.
      - name: Start installing browser secret helper build libraries
        run: |
          (
            set +e
            sudo apt-get update -o Acquire::Languages=none &&
              sudo apt-get install -y libsecret-1-dev pkg-config
            echo "$?" > "$RUNNER_TEMP/apt-status"
          ) > "$RUNNER_TEMP/apt.log" 2>&1 < /dev/null &

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Finish installing browser secret helper build libraries
        timeout-minutes: 5
        run: |
          until test -s "$RUNNER_TEMP/apt-status"; do sleep 1; done
          cat "$RUNNER_TEMP/apt.log"
          exit "$(cat "$RUNNER_TEMP/apt-status")"

      - name: Test
        run: >-
          vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo'
          --filter '!@t3tools/web' --filter '!@t3tools/mobile' test

  # apps/mobile alone took over four minutes and started last in the shared Test job.
  test-mobile:
    name: Test Mobile ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Test
        run: vp run --filter @t3tools/mobile test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  test-web:
    name: Test Web ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Upstream splits these in two on 8 vCPU runners; hosted runners have 4.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      # A cold `install --with-deps` spent almost nine minutes in apt.
      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for web browser tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Test
        run: vp run --filter @t3tools/web test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # apps/server runs one test file at a time, so upstream spreads its files over runners by
  # recorded duration (apps/server/src/testUtils/weightedShardSequencer.ts).
  test-server:
    name: Test Server ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/server/node_modules/playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium for server browser integration tests
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/server/node_modules/playwright-core/cli.js install --only-shell chromium

      - name: Install missing Chromium system dependencies
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/server/node_modules/playwright-core/cli.js install-deps chromium
          fi

      # Each file runs in its own Vitest process, so a cold module cache re-transforms its imports.
      # Only pushes to main save it, so pull requests never evict each other's entries.
      - name: Restore Vitest module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vitest-cache
          key: vitest-modules-server-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: vitest-modules-server-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Test
        run: >-
          vp run test:cached -- --shard ${{ matrix.shard }}/${{ strategy.job-total }} --concurrency 4
          --uncached apps/server/integration/transferBudgetV2.integration.test.ts apps/server

      - name: Save Vitest module cache
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vitest-cache
          key: vitest-modules-server-${{ matrix.shard }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  # Builds alongside the tests; only `release` waits for them. Upstream sync PRs build too, unsigned,
  # so a merge that breaks the macOS build never reaches main.
  build:
    name: Build macOS
    if: >-
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'bot/upstream-'))
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # git describe needs the merged upstream tags.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Resolve version
        id: version
        run: |
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*')
          echo "version=${base#v}-yc.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Cache Electron downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      # .env.example carries the public T3 Connect config that upstream preview builds use.
      - name: Use the public T3 Connect config
        run: cp .env.example .env

      # Build-time OTLP or PostHog values would bake telemetry into the bundle.
      - name: Keep telemetry out of the build
        run: |
          if grep -nE '^[[:space:]]*[A-Z0-9_]*(OTLP|POSTHOG)[A-Z0-9_]*=' .env; then
            echo "::error::.env carries telemetry config; remove it before building"
            exit 1
          fi

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"

      - name: Build
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
          T3CODE_DESKTOP_UPDATE_REPOSITORY: none
        run: >-
          node scripts/build-desktop-artifact.ts --platform mac --target zip --arch arm64
          --build-version "${{ steps.version.outputs.version }}" --output-dir dist-yc --verbose

      # electron-builder writes app-update.yml only with a publish config, and the app turns its
      # updater on only when the file exists.
      - name: Keep the built-in updater off
        run: |
          if unzip -Z1 "dist-yc/YC-${{ steps.version.outputs.version }}-arm64.zip" | grep -E 'Contents/Resources/app-update\.yml$'; then
            echo "::error::The build carries an update feed; T3CODE_DESKTOP_UPDATE_REPOSITORY=none no longer disables it"
            exit 1
          fi

      - name: Sign
        if: github.event_name != 'pull_request'
        env:
          YC_CODESIGN_P12_BASE64: ${{ secrets.YC_CODESIGN_P12_BASE64 }}
          YC_CODESIGN_P12_PASSWORD: ${{ secrets.YC_CODESIGN_P12_PASSWORD }}
        run: |
          version="${{ steps.version.outputs.version }}"
          scripts/yc/sign-macos-app.sh "dist-yc/YC-$version-arm64.zip" "YC-$version-arm64.zip"

      - name: Upload signed app
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yc-macos-arm64
          path: YC-${{ steps.version.outputs.version }}-arm64.zip
          if-no-files-found: error
          retention-days: 3

  release:
    name: Release
    needs: [check, test, test-mobile, test-web, test-server, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: yc-release
      cancel-in-progress: false
    steps:
      - name: Download signed app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: yc-macos-arm64

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${{ needs.build.outputs.version }}"
          gh release create "v$version" "YC-$version-arm64.zip" \
            --target "$GITHUB_SHA" --title "YC $version" --generate-notes --latest
