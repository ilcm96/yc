# yc's own CI and release. Upstream workflows need Blacksmith runners and T3 secrets, so they stay
# disabled in this repository; see PERSONAL.md.
name: YC

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yc-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check i18n catalogs
        run: vp run i18n:check

      - name: Format and lint
        run: vp check

      - name: Check unused code
        run: vp run knip:check

      - name: Typecheck
        run: vp run typecheck

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Test
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' --filter '!@t3tools/web' test

  test-web:
    name: Test Web
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      - name: Install Chromium for browser tests
        run: node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium

      - name: Test
        run: vp run --filter @t3tools/web test

  release:
    name: Release
    needs: [check, test, test-web]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: yc-release
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # git describe needs the merged upstream tags.
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Resolve version
        id: version
        run: |
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*')
          echo "version=${base#v}-yc.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      # .env.example carries the public T3 Connect config that upstream preview builds use.
      - name: Use the public T3 Connect config
        run: cp .env.example .env

      - name: Align package versions
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"

      - name: Build
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: none
        run: >-
          node scripts/build-desktop-artifact.ts --platform mac --target zip --arch arm64
          --build-version "${{ steps.version.outputs.version }}" --output-dir dist-yc --verbose

      - name: Sign
        env:
          YC_CODESIGN_P12_BASE64: ${{ secrets.YC_CODESIGN_P12_BASE64 }}
          YC_CODESIGN_P12_PASSWORD: ${{ secrets.YC_CODESIGN_P12_PASSWORD }}
        run: |
          version="${{ steps.version.outputs.version }}"
          scripts/yc/sign-macos-app.sh "dist-yc/YC-$version-arm64.zip" "YC-$version-arm64.zip"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          gh release create "v$version" "YC-$version-arm64.zip" \
            --target "$GITHUB_SHA" --title "YC $version" --generate-notes --latest
