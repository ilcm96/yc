# Merges each new upstream stable tag through a PR, and merges that PR once YC passes on it.
# See PERSONAL.md "Upstream 동기화". Secrets live in the main-only yc-sync environment, so
# workflows running from PR branches, upstream's included, cannot read them.
name: YC upstream sync

on:
  schedule:
    - cron: "17 19 * * *" # 04:17 KST
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream stable tag such as v0.1.12. Empty picks the newest.
        required: false
        default: ""
      force:
        description: Sync again even though a closed PR for the tag exists
        type: boolean
        default: false
  workflow_run:
    workflows: [YC]
    types: [completed]
    branches: ["bot/upstream-*"]

permissions:
  contents: read

defaults:
  run:
    # Unlike the implicit shell, an explicit bash adds pipefail, so `script | tee` fails with the script.
    shell: bash

concurrency:
  group: yc-upstream-${{ github.event_name == 'workflow_run' && 'merge' || 'sync' }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
      tag: ${{ steps.detect.outputs.tag }}
      tag_sha: ${{ steps.detect.outputs.tag_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: scripts/yc

      - name: Detect
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: scripts/yc/upstream-sync/detect.sh "$TAG" "${FORCE:-false}" | tee -a "$GITHUB_OUTPUT"

  # Runs upstream's code and Claude, so it gets the Claude token and nothing that can push.
  resolve:
    name: Resolve
    needs: detect
    if: needs.detect.outputs.skip == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: yc-sync
    env:
      TAG: ${{ needs.detect.outputs.tag }}
      TAG_SHA: ${{ needs.detect.outputs.tag_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0

      # main's own install warms the pnpm store; the merge then only adds what upstream changed.
      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps
        with:
          save-pnpm-store: "false"

      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-shell-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium and its system dependencies
        run: |
          node apps/web/node_modules/playwright/cli.js install --only-shell chromium
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      # Unpinned so `--model opus` is always the newest Opus. A changed flag or result shape fails
      # closed: Claude changes nothing (no push) or the sync goes to review.
      - name: Install Claude Code
        run: |
          npm install --prefix "$RUNNER_TEMP/claude" --no-save @anthropic-ai/claude-code@latest
          echo "$RUNNER_TEMP/claude/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Fetch the upstream tag
        run: git fetch --no-tags https://github.com/pingdotgg/t3code "+refs/tags/$TAG:refs/tags/$TAG"

      - name: Merge, resolve, and verify
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          DISABLE_AUTOUPDATER: "1"
        run: |
          # The runner reloads local composite actions for post steps. Keep their checkout on main.
          git worktree add --detach "$RUNNER_TEMP/upstream-merge" HEAD
          cd "$RUNNER_TEMP/upstream-merge"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          scripts/yc/upstream-sync/resolve.sh "$TAG" "$TAG_SHA" "$RUNNER_TEMP/sync"

      - name: Upload the sync result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-sync
          path: |
            ${{ runner.temp }}/sync/sync.bundle
            ${{ runner.temp }}/sync/body.md
            ${{ runner.temp }}/sync/notify.md
            ${{ runner.temp }}/sync/outputs
          if-no-files-found: error
          retention-days: 7

  # Holds the push token and runs only main's scripts, never the merged tree.
  publish:
    name: Publish
    needs: [detect, resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: yc-sync
    env:
      TAG: ${{ needs.detect.outputs.tag }}
      TAG_SHA: ${{ needs.detect.outputs.tag_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: scripts/yc

      - name: Download the sync result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upstream-sync
          path: ${{ runner.temp }}/sync

      - name: Push and open the PR
        env:
          GH_TOKEN: ${{ secrets.YC_SYNC_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: scripts/yc/upstream-sync/publish.sh "$TAG" "$TAG_SHA" "$RUNNER_TEMP/sync"

  merge:
    name: Merge
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: yc-sync
    permissions:
      actions: write
      contents: read
    env:
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          sparse-checkout: scripts/yc

      - name: Merge the sync PR
        if: github.event.workflow_run.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.YC_SYNC_TOKEN }}
          ACTIONS_TOKEN: ${{ github.token }}
        run: scripts/yc/upstream-sync/merge-pr.sh "$HEAD_BRANCH" "$HEAD_SHA"

      # A cancelled run was replaced by a newer one, so only real failures are reported.
      - name: Report the failed PR CI
        if: github.event.workflow_run.conclusion == 'failure'
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          echo "PR CI가 실패했습니다. 재실행해 통과하면 auto-merge 라벨인 PR은 자동으로 병합됩니다." |
            scripts/yc/upstream-sync/notify.sh failed "PR CI 실패: upstream ${HEAD_BRANCH#bot/upstream-}" "$RUN_URL"

  notify-failure:
    name: Notify failure
    needs: [detect, resolve, publish, merge]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: yc-sync
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          sparse-checkout: scripts/yc

      - name: Notify Discord
        env:
          NEEDS: ${{ toJSON(needs) }}
          TAG: ${{ needs.detect.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result == "failure") | .key' <<<"$NEEDS" | paste -sd, -)
          echo "실패한 job: $failed" |
            scripts/yc/upstream-sync/notify.sh failed "upstream 동기화 실패${TAG:+: $TAG}" "$RUN_URL"
